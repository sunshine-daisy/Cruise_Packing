<style>
  :root{
    --sea:#0b5d70; --sea2:#0f7e93; --sand:#fbe7cf; --paper:#fbf8f1;
    --ink:#13252b; --muted:#6e8086; --line:#e7ddc9; --coral:#e2674a; --coral-soft:#fbe2da;
    --ok:#1f9e84; --gold:#d2972f; --card:#ffffff;
    --accent:#0f7e93; --accent-soft:#d8ecef;
    --shadow:0 1px 2px rgba(13,40,46,.05),0 3px 10px rgba(13,40,46,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font:14.5px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  header{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff;
    padding:10px 12px 0;box-shadow:var(--shadow)}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  h1{margin:1px 0 1px;font-size:18px;font-weight:800;letter-spacing:.01em}
  .sub{font-size:12px;opacity:.85;margin-bottom:6px}
  .whoRow{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
  .whoRow b{font-weight:700}
  .whoRow button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;cursor:pointer}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 0 2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;position:relative;background:var(--sand);color:var(--sea);
    border:none;border-radius:10px 14px 0 0;padding:6px 12px 6px 22px;font-size:12.5px;
    font-weight:700;cursor:pointer;opacity:.72;transform:translateY(3px);transition:.15s}
  .tab::before{content:"";position:absolute;left:7px;top:50%;width:8px;height:8px;
    border-radius:50%;transform:translateY(-50%);
    background:var(--paper);box-shadow:inset 0 0 0 2px currentColor}
  .tab.on{opacity:1;transform:none;box-shadow:var(--shadow)}
  .tab .pct{font-weight:600;font-size:11px;opacity:.75;margin-left:5px}
  main{max-width:760px;margin:0 auto;padding:10px 10px 74px}
  .banner{display:flex;align-items:center;gap:8px;background:var(--coral-soft);
    border-left:4px solid var(--coral);border-radius:8px;padding:6px 10px;
    font-size:12px;margin:2px 0 8px}
  .banner.setup{background:#fff4d6;border-left-color:var(--gold)}
  .progressWrap{background:#e8e2d2;border-radius:99px;height:7px;overflow:hidden;margin:3px 0 10px}
  .progressBar{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
  .catHead{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 11px;cursor:pointer;user-select:none}
  .catHead h2{margin:0;font-size:13px;color:var(--accent);font-weight:800;letter-spacing:.01em}
  .catHead .count{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
  .catHead .chev{color:var(--muted);font-size:12px;margin-left:2px}
  .items{border-top:1px solid var(--line)}
  .item{display:flex;align-items:flex-start;gap:8px;padding:5px 10px;border-bottom:1px solid #f1ece0}
  .item:last-child{border-bottom:none}
  .item input[type=checkbox]{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
  .item .txt{flex:1;font-size:13.5px}
  .item.done .txt{color:var(--muted);text-decoration:line-through}
  .item .note{display:block;font-size:11px;color:var(--gold);margin-top:1px;text-decoration:none}
  .iconBtn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;
    padding:2px 5px;flex:0 0 auto;line-height:1}
  .iconBtn.del{color:#c05a49}
  .noteInput{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:7px;
    padding:5px 8px;font-size:13px}
  .addRow{display:flex;gap:6px;padding:6px 10px;background:#fdfbf5;border-top:1px dashed var(--line)}
  .addRow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
  .addRow button{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .addCat{display:flex;gap:6px;margin:2px 0 14px}
  .addCat input{flex:1;border:1px dashed var(--line);background:#fffdf6;border-radius:8px;padding:6px 10px;font-size:13px}
  .addCat button{background:#fff;color:var(--accent);border:1.5px solid var(--accent);
    border-radius:8px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid var(--line);
    display:flex;gap:6px;justify-content:center;padding:7px;box-shadow:0 -2px 10px rgba(13,40,46,.06)}
  footer button{background:#fff;border:1px solid var(--line);border-radius:99px;
    padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--sea);cursor:pointer}
  footer button.warn{color:#c05a49}
  .toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13px;border-radius:99px;
    padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
  .toast.show{opacity:.94}
  .overlay{position:fixed;inset:0;background:rgba(11,53,64,.72);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:16px;overflow:auto}
  .overlay .box{background:var(--paper);border-radius:16px;padding:20px 18px;max-width:420px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
  .overlay h2{margin:0 0 4px;color:var(--sea);font-size:18px;text-align:center}
  .overlay p{font-size:13px;color:var(--muted);margin:0 0 14px;text-align:center}
  .overlay .who{display:block;width:100%;margin-bottom:8px;background:#fff;border:2px solid var(--line);
    border-radius:12px;padding:11px;font-size:15px;font-weight:700;cursor:pointer}
  /* settings */
  .set h3{margin:12px 0 6px;font-size:13px;color:var(--sea);text-transform:uppercase;letter-spacing:.06em}
  .set label{display:block;font-size:11.5px;color:var(--muted);margin:7px 0 2px}
  .set input[type=text], .set select{width:100%;border:1px solid var(--line);border-radius:8px;
    padding:6px 9px;font-size:13.5px;background:#fff}
  .pRow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .pRow .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
  .pRow input[type=text]{flex:1.2}
  .pRow select{flex:1}
  .pRow .iconBtn{font-size:17px}
  .setBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .setBtns button{border-radius:99px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .setBtns .save{background:var(--sea);color:#fff;border:none}
  .setBtns .cancel{background:#fff;color:var(--muted);border:1px solid var(--line)}
  .addPerson{display:flex;gap:6px;margin-top:6px}
  .addPerson button{background:#fff;color:var(--sea);border:1.5px solid var(--sea);
    border-radius:8px;padding:5px 12px;font-weight:700;font-size:12.5px;cursor:pointer;flex:0 0 auto}
  .pbox{display:none}
  #printHead{display:none}
  .loading{padding:50px 0;text-align:center;color:var(--muted);font-size:14px}

    header,.addRow,.addCat,footer,.iconBtn,.banner,.overlay{display:none!important}
    body{background:#fff}
    .cat{box-shadow:none;break-inside:avoid}
    main{padding:0;max-width:none}
    .item input[type=checkbox]{display:none}
    .pbox{display:inline;font-size:14px;line-height:1;margin-right:6px;flex:0 0 auto}
    .item.done .txt{color:#777}
    #printHead{display:block;border-bottom:2px solid #333;padding-bottom:4px;margin-bottom:8px;
      font-size:15px;font-weight:800}
    #printHead small{display:block;font-weight:400;font-size:11px;color:#555;margin-top:1px}
  }

const PERSON_TEMPLATE = () => JSON.parse(JSON.stringify(SEED.camila.map(c=>({n:c.n, items:(c.items||[]).map(it=>({i:it.i,n:it.n,c:0,note:""}))}))));

/* ---------------- state ---------------- */
let profile = null;
let cur = "shared";
let data = {};
let dirty = {};
let collapsed = {};
let resetArmed = false;
let db = null;
let fbReady = false;
let watched = {};
let settingsOpen = false;
let draft = null;   // working copy of meta while settings is open

const $ = id => document.getElementById(id);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1900); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function items(c){ return c.items || (c.items=[]); }
function people(){ return (meta||DEFAULT_META).people; }
function extras(){ return (meta||DEFAULT_META).extras || []; }
function extra(id){ return extras().find(x=>x.id===id) || null; }
function person(id){ return people().find(p=>p.id===id) || null; }
function isGroup(id){ return !!GROUPS[id] || !!extra(id); }
function nameOf(id){ if(GROUPS[id]) return GROUPS[id]; const x=extra(id); if(x) return x.name; return person(id)?person(id).name:id; }
function listIds(){ return ["shared", ...people().map(p=>p.id), ...extras().map(x=>x.id), "shore","home"]; }
function me(){ return person(profile); }
function canEdit(listId){
  const m = me(); if(!m) return false;
  if(m.role==="organizer") return true;
  if(listId===m.id) return true;
  if(m.role==="own") return false;
  // helper:
  if(isGroup(listId)) return true;
  const t = person(listId);
  return !!t && t.role!=="own";
}
function ownersOf(listId){
  return people().filter(p=>{
    if(p.role==="organizer") return true;
    if(listId===p.id) return true;
    if(p.role==="own") return false;
    if(isGroup(listId)) return true;
    const t=person(listId); return !!t && t.role!=="own";
  }).map(p=>p.name).join(" & ");
}

/* ---------------- firebase ---------------- */
function fbConfigured(){ return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE"); }
async function initFirebase(){
  if(!fbConfigured()) return false;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.database();
    fbReady = true;
    return true;
  }catch(e){ console.error("Firebase init failed", e); toast("Could not connect — check the Firebase config"); return false; }
}
function watchMeta(){
  db.ref("meta").on("value", snap=>{
    const v = snap.val();
    if(v && v.people && v.people.length){
      if(!settingsOpen) meta = v;
    }else{
      db.ref("meta").transaction(curVal=>{ if(curVal===null || !curVal.people) return Object.assign({}, DEFAULT_META, curVal||{}); });
      meta = DEFAULT_META;
    }
    listIds().forEach(watchList);
    if(profile && !me()){ profile=null; showPicker(); }
    renderHeader(); renderChrome(); render();
    applyMigrations();
  }, err=>{ console.error(err); toast("Sync error — are the database rules published?"); });
}
/* one-time content migration (seedRev 2): items added Jul 2026 from the trip plan */
const MIGRATIONS = [
  {list:"shared", cat:"Medicines & First Aid Kit", items:["Vomit bags (a few for the cabin + one per day bag)"]},
  {list:"shared", cat:"Documents & Money (group set)", items:["Birth-certificate copy + notarized consent letter (minor without both guardians)"]},
  {list:"shore", cat:null, items:["Camera + spare battery + memory card","Local map / port guide","Motion-sickness tablets (take BEFORE the Amber Cove catamaran)","Vomit bag (taxis; the catamaran)"]},
  {list:"home", cat:null, items:["AA online check-in \u2014 24 hrs before Friday's flight (Jul 23)","Download HUB app + set up $5/person chat","USPS mail hold","Leave a copy of the itinerary with someone at home"]},
  {list:"lilian", cat:"Flight Carry-On (TSA 3-1-1)", items:["Jewelry & valuables \u2014 never in checked bags"]},
  {list:"isa", cat:"Flight Carry-On (TSA 3-1-1)", items:["Jewelry & valuables \u2014 never in checked bags"]},
  {list:"camila", cat:"Flight Carry-On (TSA 3-1-1)", items:["Jewelry & valuables \u2014 never in checked bags"]},
  {list:"isa", cat:"CPAP (sleep gear)", createCat:true, beforeCat:"Electronics",
   items:["CPAP machine + mask + hose (distilled water pre-paid \u2014 delivered to cabin)","CPAP power cord + extension cord"]}
];
let migrationStarted = false;
function applyMigrations(){
  if(migrationStarted || !db) return;
  migrationStarted = true;
  db.ref("meta/seedRev").transaction(v=>{ if(!v || v<2) return 2; },
    (err, committed)=>{ if(err || !committed) return; runMigrationWrites(); });
}
function runMigrationWrites(){
  MIGRATIONS.forEach(m=>{
    db.ref("packing/"+m.list).transaction(cur=>{
      if(!cur) return;                        // list not seeded yet — fresh seeds already include these
      cur.cats = cur.cats || [];
      let cat = m.cat ? cur.cats.find(c=>c && c.n===m.cat) : cur.cats[0];
      if(!cat){
        if(!m.createCat) return cur;
        cat = {n:m.cat, items:[]};
        const at = m.beforeCat ? cur.cats.findIndex(c=>c && c.n===m.beforeCat) : -1;
        if(at>=0) cur.cats.splice(at,0,cat); else cur.cats.push(cat);
      }
      cat.items = cat.items || [];
      m.items.forEach((n,j)=>{
        if(!cat.items.some(it=>it && it.n===n))
          cat.items.push({i:"mg2_"+m.list+"_"+j+"_"+cat.items.length, n:n, c:0, note:""});
      });
      return cur;
    });
  });
}
function watchList(id){
  if(watched[id] || !db) return;
  watched[id]=true;
  db.ref("packing/"+id).on("value", snap=>{
    if(dirty[id]) return;
    const v = snap.val();
    if(v){
      v.cats = v.cats || [];
      v.cats.forEach(c=>{ c.items = c.items || []; });
      if(id==="shared"){
        const n0=v.cats.length;
        v.cats=v.cats.filter(c=>!/^(Shore-Day Bag|Before You Leave Home)/.test(c.n));
        if(v.cats.length!==n0) db.ref("packing/"+id).set(v);
      }
      data[id]=v;
    }else{
      const seedCats = SEED[id] ? SEED[id] : (extra(id) ? [{n:"Items", items:[]}] : PERSON_TEMPLATE());
      db.ref("packing/"+id).transaction(curVal=>{
        if(curVal===null) return {cats:seedCats, by:"", at:Date.now()};
      });
      data[id]={cats:seedCats, by:"", at:Date.now()};
    }
    if(id===cur) render(); else renderChrome();
  });
}
function saveList(id){
  clearTimeout(dirty[id]);
  dirty[id] = setTimeout(()=>{
    delete dirty[id];
    if(!fbReady){ toast("Not connected — changes are not saving"); return; }
    const clean = JSON.parse(JSON.stringify(data[id], (k,v)=> (typeof k==="string" && k.startsWith("_")) ? undefined : v));
    clean.by = me()?me().name:""; clean.at = Date.now();
    db.ref("packing/"+id).set(clean).catch(e=>{ console.error(e); toast("Save failed — check connection"); });
  }, 700);
}

/* ---------------- rendering ---------------- */
function counts(id){
  let done=0, tot=0;
  (data[id]?.cats||[]).forEach(c=>items(c).forEach(it=>{tot++; if(it.c)done++;}));
  return {done, tot, pct: tot? Math.round(done/tot*100):0};
}
function renderHeader(){
  const t=(meta||DEFAULT_META).trip;
  $("hEyebrow").textContent=t.eyebrow; $("hTitle").textContent=t.title; $("hSub").textContent=t.sub;
  document.title=t.title;
}
function renderChrome(){
  if(!profile || !me()) return;
  $("whoRow").style.display = "flex";
  $("whoName").textContent = me().name;
  $("setBtn").style.display = me().role==="organizer" ? "inline-block" : "none";
  $("footer").style.display = "flex";
  const tabs = $("tabs"); tabs.innerHTML = "";
  if(!listIds().includes(cur)) cur="shared";
  listIds().forEach(id=>{
    const b=document.createElement("button");
    b.className="tab"+(id===cur?" on":"");
    const p=person(id)||extra(id);
    if(p && p.color){ b.style.background=p.soft; b.style.color=p.color; }
    const k=counts(id);
    b.innerHTML = esc(nameOf(id)) + '<span class="pct">'+k.pct+'%</span>';
    b.onclick=()=>{ cur=id; renderChrome(); render(); };
    tabs.appendChild(b);
  });
}
function render(){
  const p=person(cur)||extra(cur);
  document.body.style.setProperty("--accent", (p&&p.color)?p.color:"#0f7e93");
  document.body.style.setProperty("--accent-soft", (p&&p.soft)?p.soft:"#d8ecef");
  const main=$("main"); const list=data[cur];
  if(!list){ main.innerHTML='<div class="loading">Loading&hellip;</div>'; return; }
  const editable = canEdit(cur);
  const k = counts(cur);
  const today = new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  let h = '<div id="printHead">'+esc(nameOf(cur))+' \u2014 '+esc((meta||DEFAULT_META).trip.title)
    + '<small>'+k.done+' of '+k.tot+' packed \u00b7 printed '+esc(today)
    + (me()? ' by '+esc(me().name) : '')+'</small></div>';
  if(!fbConfigured()) h += '<div class="banner setup">&#9881; Setup needed: paste your Firebase config into this file — nothing will sync until then.</div>';
  if(!editable) h += '<div class="banner">&#128065; View only — '+esc(nameOf(cur))+"'s list is updated by "+esc(ownersOf(cur))+'.</div>';
  h += '<div class="progressWrap"><div class="progressBar" style="width:'+k.pct+'%"></div></div>';
  list.cats.forEach((c,ci)=>{
    const its = items(c);
    const cd = its.filter(i=>i.c).length;
    const col = collapsed[cur+"|"+c.n];
    h += '<section class="cat"><div class="catHead" onclick="toggleCat('+ci+')">'
      + '<h2>'+esc(c.n)+'</h2><span class="count">'+cd+' / '+its.length;
    if(canEdit(cur) && cd>0){
      h += ' <button class="iconBtn" title="Reset checkmarks in this category" onclick="event.stopPropagation();resetCat('+ci+')">&#8634;</button>';
    }
    if(canEdit(cur) && its.length===0){
      h += ' <button class="iconBtn del" title="Remove empty category" onclick="event.stopPropagation();delCat('+ci+')">&times;</button>';
    }
    h += ' <span class="chev">'+(col?"&#9656;":"&#9662;")+'</span></span></div>';
    if(!col){
      h += '<div class="items">';
      its.forEach((it,ii)=>{
        h += '<div class="item'+(it.c?" done":"")+'">'
          + '<span class="pbox">'+(it.c?'\u2611':'\u2610')+'</span>'
          + '<input type="checkbox" '+(it.c?"checked ":"")+(editable?"":"disabled ")
          + 'onchange="toggleItem('+ci+','+ii+',this.checked)">'
          + '<div class="txt">'+esc(it.n)
          + (it.note?'<span class="note">&#9998; '+esc(it.note)+'</span>':'')
          + (it._editNote?'<input class="noteInput" value="'+esc(it.note||"")+'" placeholder="Add a note" '
              +'onkeydown="if(event.key===\'Enter\')this.blur()" onblur="saveNote('+ci+','+ii+',this.value)">':'')
          + '</div>';
        if(editable){
          h += '<button class="iconBtn" title="Note" onclick="editNote('+ci+','+ii+')">&#9998;</button>'
            +  '<button class="iconBtn del" title="Remove" onclick="delItem('+ci+','+ii+')">&times;</button>';
        }
        h += '</div>';
      });
      h += '</div>';
      if(editable){
        h += '<div class="addRow"><input id="add_'+ci+'" placeholder="Add an item to '+esc(c.n)+'" '
          + 'onkeydown="if(event.key===\'Enter\')addItem('+ci+')">'
          + '<button onclick="addItem('+ci+')">Add</button></div>';
      }
    }
    h += '</section>';
  });
  if(editable){
    h += '<div class="addCat"><input id="addCatName" placeholder="Add a category to this list (e.g. Souvenirs)" '
      + 'onkeydown="if(event.key===\'Enter\')addCat()"><button onclick="addCat()">+ Category</button></div>';
  }
  main.innerHTML = h;
  renderChrome();
}

/* ---------------- list actions ---------------- */
function toggleCat(ci){ const key=cur+"|"+data[cur].cats[ci].n; collapsed[key]=!collapsed[key]; render(); }
function toggleItem(ci,ii,val){
  if(!canEdit(cur)) return;
  items(data[cur].cats[ci])[ii].c = val?1:0;
  saveList(cur); render();
}
function addItem(ci){
  if(!canEdit(cur)) return;
  const inp=$("add_"+ci); const v=(inp.value||"").trim(); if(!v) return;
  items(data[cur].cats[ci]).push({i:"c"+Date.now(), n:v, c:0, note:""});
  inp.value="";
  saveList(cur); render();
  const again=$("add_"+ci); if(again) again.focus();
}
function delItem(ci,ii){
  if(!canEdit(cur)) return;
  const it=items(data[cur].cats[ci])[ii];
  if(!it._armDel){ it._armDel=true; toast('Tap \u00d7 again to remove "'+it.n+'"');
    setTimeout(()=>{delete it._armDel;},2500); return; }
  items(data[cur].cats[ci]).splice(ii,1);
  saveList(cur); render();
}
function addCat(){
  if(!canEdit(cur)) return;
  const inp=$("addCatName"); const v=(inp.value||"").trim(); if(!v) return;
  if(data[cur].cats.some(c=>c.n.toLowerCase()===v.toLowerCase())){ toast("That category already exists"); return; }
  data[cur].cats.push({n:v, items:[]});
  saveList(cur); render(); toast('Category "'+v+'" added');
}
function delCat(ci){
  if(!canEdit(cur)) return;
  const c=data[cur].cats[ci];
  if(items(c).length){ toast("Only empty categories can be removed"); return; }
  if(!c._armDel){ c._armDel=true; toast('Tap \u00d7 again to remove "'+c.n+'"');
    setTimeout(()=>{delete c._armDel;},2500); return; }
  data[cur].cats.splice(ci,1);
  saveList(cur); render();
}
function editNote(ci,ii){
  const it=items(data[cur].cats[ci])[ii];
  it._editNote = !it._editNote; render();
  const inp=document.querySelector(".noteInput"); if(inp) inp.focus();
}
function saveNote(ci,ii,val){
  const it=items(data[cur].cats[ci])[ii];
  it.note=(val||"").trim(); delete it._editNote;
  saveList(cur); render();
}
function resetCat(ci){
  if(!canEdit(cur)) return;
  const c=data[cur].cats[ci];
  if(!c._armReset){ c._armReset=true; toast('Tap \u21ba again to clear "'+c.n+'"');
    setTimeout(()=>{delete c._armReset;},2500); return; }
  delete c._armReset;
  items(c).forEach(it=>it.c=0);
  saveList(cur); render(); toast('"'+c.n+'" cleared');
}
function resetChecks(){
  if(!canEdit(cur)){ toast("View-only list"); return; }
  if(!resetArmed){ resetArmed=true; $("resetBtn").textContent="Tap again to confirm";
    setTimeout(()=>{resetArmed=false; $("resetBtn").textContent="Reset checkmarks";},2500); return; }
  resetArmed=false; $("resetBtn").textContent="Reset checkmarks";
  data[cur].cats.forEach(c=>items(c).forEach(it=>it.c=0));
  saveList(cur); render(); toast(nameOf(cur)+" checkmarks cleared");
}
function printList(){
  const keys=Object.keys(collapsed).filter(k=>k.startsWith(cur+"|")&&collapsed[k]);
  keys.forEach(k=>collapsed[k]=false);
  render();
  const restore=()=>{ keys.forEach(k=>collapsed[k]=true); render(); window.onafterprint=null; };
  window.onafterprint=restore;
  setTimeout(()=>{ window.print(); setTimeout(restore,1500); }, 60);
}

/* ---------------- trip settings (organizer only) ---------------- */
function openSettings(){
  if(!me() || me().role!=="organizer"){ toast("Only the organizer can change trip settings"); return; }

function colorOptions(sel){
  return COLORS.map(c=>'<option value="'+c.c+'|'+c.s+'"'+(sel===c.c?' selected':'')+'>'+c.n+'</option>').join('');
}
function renderSettings(){

      +'</select>'
      +'<select onchange="setColor('+i+',this.value)">'+colorOptions(p.color)+'</select>'
      +'<button class="iconBtn del" title="Remove traveler" onclick="removePerson('+i+')">&times;</button>'
      +'</div>';
  });
  h+='<div class="addPerson"><input type="text" id="npName" placeholder="New traveler\u2019s name">'
    +'<button onclick="addPerson()">+ Add</button></div>';
  h+='<h3>Extra lists</h3>';
  if(!draft.extras) draft.extras=[];
  draft.extras.forEach((x,i)=>{

      +'<span class="dot" style="background:'+esc(x.color)+'"></span>'
      +'<input type="text" value="'+esc(x.name)+'" onchange="draft.extras['+i+'].name=this.value">'
      +'<select onchange="setExtraColor('+i+',this.value)">'+colorOptions(x.color)+'</select>'
      +'<button class="iconBtn del" title="Remove list" onclick="removeExtra('+i+')">&times;</button>'
      +'</div>';
  });
  h+='<div class="addPerson"><input type="text" id="nxName" placeholder="New list (e.g. For Dad)">'
    +'<button onclick="addExtra()">+ Add</button></div>';
  h+='<p style="text-align:left;font-size:11.5px;margin-top:4px">Extra lists are group tabs \u2014 not tied to a traveler. Organizers and Helpers can update them; everyone can see them.</p>';
  h+='<p style="text-align:left;font-size:11.5px;margin-top:8px">A new traveler gets a fresh copy of the standard individual list and shows up as a tab on everyone\u2019s phone. Removing a traveler deletes their tab and their list data.</p>';
  h+='<div class="setBtns"><button class="cancel" onclick="closeSettings()">Cancel</button>'
    +'<button class="save" onclick="saveSettings()">Save changes</button></div>';
  b.innerHTML=h;
}
function setRole(i,v){ draft.people[i].role=v; }
function setColor(i,v){ const [c,s]=v.split("|"); draft.people[i].color=c; draft.people[i].soft=s; renderSettings(); }
function addPerson(){
  const inp=$("npName"); const v=(inp.value||"").trim(); if(!v) return;
  if(draft.people.some(p=>p.name.toLowerCase()===v.toLowerCase())){ toast("That name is already on the trip"); return; }
  const used=draft.people.map(p=>p.color);
  const free=COLORS.find(c=>!used.includes(c.c))||COLORS[0];
  const id=v.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12)+"_"+Date.now().toString(36);
  draft.people.push({id:id, name:v, role:"own", color:free.c, soft:free.s});
  inp.value=""; renderSettings();
}
function setExtraColor(i,v){ const [c,s]=v.split("|"); draft.extras[i].color=c; draft.extras[i].soft=s; renderSettings(); }
function addExtra(){
  const inp=$("nxName"); const v=(inp.value||"").trim(); if(!v) return;
  if(!draft.extras) draft.extras=[];
  if(draft.extras.some(x=>x.name.toLowerCase()===v.toLowerCase())){ toast("That list already exists"); return; }
  const used=draft.people.map(p=>p.color).concat(draft.extras.map(x=>x.color));
  const free=COLORS.find(c=>!used.includes(c.c))||COLORS[1];
  const id="x_"+v.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12)+"_"+Date.now().toString(36);
  draft.extras.push({id:id, name:v, color:free.c, soft:free.s});
  inp.value=""; renderSettings();
}
function removeExtra(i){
  const x=draft.extras[i];
  if(!x._armDel){ x._armDel=true; toast('Tap \u00d7 again to remove "'+x.name+'" and its items');
    setTimeout(()=>{delete x._armDel;},2500); return; }
  draft.extras.splice(i,1); renderSettings();
}
function removePerson(i){
  const p=draft.people[i];
  if(p.id===profile){ toast("You can't remove yourself"); return; }
  if(p.role==="organizer" && draft.people.filter(x=>x.role==="organizer").length===1){
    toast("The trip needs at least one organizer"); return; }
  if(!p._armDel){ p._armDel=true; toast('Tap \u00d7 again to remove '+p.name+' and their list');
    setTimeout(()=>{delete p._armDel;},2500); return; }
  draft.people.splice(i,1); renderSettings();
}
function closeSettings(){ settingsOpen=false; draft=null; $("settings").style.display="none"; }
function saveSettings(){
  draft.trip.eyebrow=$("tEye").value.trim();
  draft.trip.title=$("tTitle").value.trim()||"Packing Lists";
  draft.trip.sub=$("tSub").value.trim();
  if(!draft.people.some(x=>x.role==="organizer")){ toast("The trip needs at least one organizer"); return; }
  const removed = people().filter(p=>!draft.people.some(d=>d.id===p.id))
    .concat(extras().filter(x=>!(draft.extras||[]).some(d=>d.id===x.id)));
  const clean = JSON.parse(JSON.stringify(draft, (k,v)=> (typeof k==="string" && k.startsWith("_")) ? undefined : v));
  meta = clean;
  settingsOpen=false; $("settings").style.display="none"; draft=null;
  if(fbReady){
    db.ref("meta").set(clean).catch(e=>{ console.error(e); toast("Save failed — check connection"); });
    removed.forEach(p=>{ db.ref("packing/"+p.id).remove(); delete data[p.id]; });
  }
  renderHeader(); renderChrome(); render();
  toast("Trip settings saved");
}

/* ---------------- boot ---------------- */
(async function(){
  initProfile();
  const ok = await initFirebase();
  if(ok){
    watchMeta();
  }else{
    meta = DEFAULT_META;
    listIds().forEach(id=>{ data[id]={cats: SEED[id]?SEED[id]:PERSON_TEMPLATE(), by:"", at:0}; });
    renderHeader();
    if(profile) renderChrome();
    render();
  }
})();
</script>
