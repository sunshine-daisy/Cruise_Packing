function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function canEdit(list){ return profile && CAN_EDIT[profile].includes(list); }
function items(c){ return c.items || (c.items=[]); }

/* ---------------- firebase sync ---------------- */
function fbConfigured(){ return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE"); }
async function initFirebase(){
  if(!fbConfigured()) return false;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    db = firebase.database();
    fbReady = true;
    return true;
  }catch(e){ console.error("Firebase init failed", e); toast("Could not connect — check the Firebase config"); return false; }
}
function watchList(id){
  db.ref("packing/"+id).on("value", snap=>{
    if(dirty[id]) return;                       // don't clobber pending local edits
    const v = snap.val();
    if(v){
      // sanitize: RTDB drops empty arrays
      v.cats = v.cats || [];
      v.cats.forEach(c=>{ c.items = c.items || []; });
      if(id==="shared"){
        const n0=v.cats.length;
        v.cats=v.cats.filter(c=>!/^(Shore-Day Bag|Before You Leave Home)/.test(c.n));
        if(v.cats.length!==n0) db.ref("packing/"+id).set(v);
      }
      data[id]=v;
    }else{
      // first opener seeds the database (transaction avoids double-seed races)
      db.ref("packing/"+id).transaction(curVal=>{
        if(curVal===null) return {cats:SEED[id], by:"", at:Date.now()};
      });
      data[id]={cats:SEED[id], by:"", at:Date.now()};
    }
    if(id===cur) render(); else renderChrome();
  }, err=>{ console.error(err); toast("Sync error — are the database rules published?"); });
}
function saveList(id){
  clearTimeout(dirty[id]);
  dirty[id] = setTimeout(()=>{
    delete dirty[id];
    if(!fbReady){ toast("Not connected — changes are not saving"); return; }
    const clean = JSON.parse(JSON.stringify(data[id], (k,v)=> k.startsWith("_") ? undefined : v));
    clean.by = NAMES[profile]||""; clean.at = Date.now();
    db.ref("packing/"+id).set(clean).catch(e=>{ console.error(e); toast("Save failed — check connection"); });
  }, 700);
}

/* ---------------- profile (per device) ---------------- */
function initProfile(){
  try{
    const p = localStorage.getItem("pl:profile");
    if(p && CAN_EDIT[p]){ profile = p; return; }
  }catch(e){}
  $("overlay").style.display = "flex";
}
function setProfile(p){
  profile = p;
  $("overlay").style.display = "none";
  try{ localStorage.setItem("pl:profile", p); }catch(e){}
  renderChrome(); render();
}
function switchProfile(){ $("overlay").style.display = "flex"; }

/* ---------------- rendering ---------------- */
function counts(id){
  let done=0, tot=0;
  (data[id]?.cats||[]).forEach(c=>items(c).forEach(it=>{tot++; if(it.c)done++;}));
  return {done, tot, pct: tot? Math.round(done/tot*100):0};
}
function renderChrome(){
  if(!profile) return;
  $("whoRow").style.display = "flex";
  $("whoName").textContent = NAMES[profile];
  $("footer").style.display = "flex";
  const tabs = $("tabs"); tabs.innerHTML = "";
  LISTS.forEach(id=>{
    const b=document.createElement("button");
    b.className="tab"+(id===cur?" on":"");
    b.dataset.id=id;
    const k=counts(id);
    b.innerHTML = esc(NAMES[id]) + '<span class="pct">'+k.pct+'%</span>';
    b.onclick=()=>{ cur=id; renderChrome(); render(); };
    tabs.appendChild(b);
  });
}
function ownersOf(id){
  return Object.keys(CAN_EDIT).filter(p=>CAN_EDIT[p].includes(id)).map(p=>NAMES[p]).join(" & ");
}
function render(){
  document.body.dataset.list = cur;
  const main=$("main"); const list=data[cur];
  if(!list){ main.innerHTML='<div class="loading">Loading&hellip;</div>'; return; }
  const editable = canEdit(cur);
  const k = counts(cur);
  const today = new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  let h = '<div id="printHead">'+esc(NAMES[cur])+' \u2014 Cruise Packing \u00b7 Carnival Celebration SJ63G1'
    + '<small>'+k.done+' of '+k.tot+' packed \u00b7 printed '+esc(today)
    + (profile? ' by '+esc(NAMES[profile]) : '')+'</small></div>';
  if(!fbConfigured()) h += '<div class="banner setup">&#9881; Setup needed: paste your Firebase config into this file (see the comment at the top of the script) — nothing will sync until then.</div>';
  if(!editable) h += '<div class="banner">&#128065; View only — '+esc(NAMES[cur])+"'s list is updated by "+ownersOf(cur)+'.</div>';
  h += '<div class="progressWrap"><div class="progressBar" style="width:'+k.pct+'%"></div></div>';
  list.cats.forEach((c,ci)=>{
    const its = items(c);
    const cd = its.filter(i=>i.c).length;
    const col = collapsed[cur+"|"+c.n];
    h += '<section class="cat"><div class="catHead" onclick="toggleCat('+ci+')">'
      + '<h2>'+esc(c.n)+'</h2><span class="count">'+cd+' / '+its.length;
    if(editable && its.length===0){
      h += ' <button class="iconBtn del" title="Remove empty category" onclick="event.stopPropagation();delCat('+ci+')">&times;</button>';
    }
    h += ' <span class="chev">'+(col?"&#9656;":"&#9662;")+'</span></span></div>';
    if(!col){
      h += '<div class="items">';
      its.forEach((it,ii)=>{
        h += '<div class="item'+(it.c?" done":"")+'">'
          + '<span class="pbox">'+(it.c?'\u2611':'\u2610')+'</span>'
          + '<input type="checkbox" '+(it.c?"checked ":"")+(editable?"":"disabled ")
          + 'onchange="toggleItem('+ci+','+ii+',this.checked)">'
          + '<div class="txt">'+esc(it.n)
          + (it.note?'<span class="note">&#9998; '+esc(it.note)+'</span>':'')
          + (it._editNote?'<input class="noteInput" value="'+esc(it.note||"")+'" placeholder="Add a note" '
              +'onkeydown="if(event.key===\'Enter\')this.blur()" onblur="saveNote('+ci+','+ii+',this.value)">':'')
          + '</div>';
        if(editable){
          h += '<button class="iconBtn" title="Note" onclick="editNote('+ci+','+ii+')">&#9998;</button>'
            +  '<button class="iconBtn del" title="Remove" onclick="delItem('+ci+','+ii+')">&times;</button>';
        }
        h += '</div>';
      });
      h += '</div>';
      if(editable){
        h += '<div class="addRow"><input id="add_'+ci+'" placeholder="Add an item to '+esc(c.n)+'" '
          + 'onkeydown="if(event.key===\'Enter\')addItem('+ci+')">'
          + '<button onclick="addItem('+ci+')">Add</button></div>';
      }
    }
    h += '</section>';
  });
  if(editable){
    h += '<div class="addCat"><input id="addCatName" placeholder="Add a category to this list (e.g. Souvenirs)" '
      + 'onkeydown="if(event.key===\'Enter\')addCat()"><button onclick="addCat()">+ Category</button></div>';
  }
  main.innerHTML = h;
  renderChrome();
}

/* ---------------- actions ---------------- */
function toggleCat(ci){ const key=cur+"|"+data[cur].cats[ci].n; collapsed[key]=!collapsed[key]; render(); }
function toggleItem(ci,ii,val){
  if(!canEdit(cur)) return;
  items(data[cur].cats[ci])[ii].c = val?1:0;
  saveList(cur); render();
}
function addItem(ci){
  if(!canEdit(cur)) return;
  const inp=$("add_"+ci); const v=(inp.value||"").trim(); if(!v) return;
  items(data[cur].cats[ci]).push({i:"c"+Date.now(), n:v, c:0, note:""});
  inp.value="";
  saveList(cur); render();
  const again=$("add_"+ci); if(again) again.focus();
}
function delItem(ci,ii){
  if(!canEdit(cur)) return;
  const it=items(data[cur].cats[ci])[ii];
  if(!it._armDel){ it._armDel=true; toast('Tap \u00d7 again to remove "'+it.n+'"');
    setTimeout(()=>{delete it._armDel;},2500); return; }
  items(data[cur].cats[ci]).splice(ii,1);
  saveList(cur); render();
}
function addCat(){
  if(!canEdit(cur)) return;
  const inp=$("addCatName"); const v=(inp.value||"").trim(); if(!v) return;
  if(data[cur].cats.some(c=>c.n.toLowerCase()===v.toLowerCase())){ toast("That category already exists"); return; }
  data[cur].cats.push({n:v, items:[]});
  saveList(cur); render(); toast('Category "'+v+'" added');
}
function delCat(ci){
  if(!canEdit(cur)) return;
  const c=data[cur].cats[ci];
  if(items(c).length){ toast("Only empty categories can be removed"); return; }
  if(!c._armDel){ c._armDel=true; toast('Tap \u00d7 again to remove "'+c.n+'"');
    setTimeout(()=>{delete c._armDel;},2500); return; }
  data[cur].cats.splice(ci,1);
  saveList(cur); render();
}
function editNote(ci,ii){
  const it=items(data[cur].cats[ci])[ii];
  it._editNote = !it._editNote; render();
  const inp=document.querySelector(".noteInput"); if(inp) inp.focus();
}
function saveNote(ci,ii,val){
  const it=items(data[cur].cats[ci])[ii];
  it.note=(val||"").trim(); delete it._editNote;
  saveList(cur); render();
}
function printList(){
  const keys=Object.keys(collapsed).filter(k=>k.startsWith(cur+"|")&&collapsed[k]);
  keys.forEach(k=>collapsed[k]=false);
  render();
  const restore=()=>{ keys.forEach(k=>collapsed[k]=true); render(); window.onafterprint=null; };
  window.onafterprint=restore;
  setTimeout(()=>{ window.print(); setTimeout(restore,1500); }, 60);
}
function resetChecks(){
  if(!canEdit(cur)){ toast("View-only list"); return; }
  if(!resetArmed){ resetArmed=true; $("resetBtn").textContent="Tap again to confirm";
    setTimeout(()=>{resetArmed=false; $("resetBtn").textContent="Reset checkmarks";},2500); return; }
  resetArmed=false; $("resetBtn").textContent="Reset checkmarks";
  data[cur].cats.forEach(c=>items(c).forEach(it=>it.c=0));
  saveList(cur); render(); toast(NAMES[cur]+" checkmarks cleared");
}

/* ---------------- boot ---------------- */
(async function(){
  initProfile();
  const ok = await initFirebase();
  if(ok){
    LISTS.forEach(watchList);
  }else{
    // no backend yet: show seeded lists locally so the page is still browsable
    LISTS.forEach(id=>{ data[id]={cats:SEED[id], by:"", at:0}; });
  }
  if(profile) renderChrome();
  render();
})();
</script>
</body>
</html>
